spring:
  datasource:
    url: jdbc:h2:mem:analytics;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    enabled: false
