openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Analytics
  description: 아지트 검색·랭킹
- name: Analytics
  description: 검색·조회 이벤트 Kafka 발행
paths:
  /api/v1/events:
    post:
      tags:
      - Analytics
      summary: 검색/조회 이벤트 발행
      description: DB에 쌓지 않고 Kafka 토픽만 produce합니다.
      operationId: publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMetricRequest"
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "202":
          description: Accepted
  /api/v1/agits/search:
    get:
      tags:
      - Analytics
      summary: 아지트 검색
      description: sort=new|popular|rising. 정산·집계는 Kafka EDA로 비동기 처리됩니다.
      operationId: search
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: new
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgitSearchPageResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    PublishMetricRequest:
      type: object
      properties:
        type:
          type: string
        agitUuid:
          type: string
    AgitSearchItemResponse:
      type: object
      properties:
        agitUuid:
          type: string
        agitName:
          type: string
        description:
          type: string
        thumbnailPath:
          type: string
        createdAt:
          type: string
          format: date-time
        score:
          type: number
          format: double
    AgitSearchPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgitSearchItemResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
